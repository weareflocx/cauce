<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CAUCE · Herramientas</title>
  <meta name="description" content="Herramientas generativas de la identidad CAUCE — FLOC*" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23262929'/%3E%3Cpath d='M4 11c6-4 18 4 24 0M4 16c6-4 18 4 24 0M4 21c6-4 18 4 24 0' fill='none' stroke='%23FBFD9D' stroke-width='2'/%3E%3C/svg%3E" />
  <style>
    :root {
      --papel: #f0f6f5;
      --tinta: #262929;
      --lima: #fbfd9d;
      --bruma: #c2cfcf;
      --mono: 'SFMono-Regular', ui-monospace, Menlo, monospace;
      --grotesk: Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--grotesk);
      background: var(--papel);
      color: var(--tinta);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      padding: 18px 24px; border-bottom: 1px solid var(--tinta);
    }
    .marca { font-weight: 700; letter-spacing: 0.14em; font-size: 15px; }
    .marca span { font-weight: 400; opacity: 0.5; letter-spacing: 0.1em; }
    .firma { font-family: var(--mono); font-size: 11px; opacity: 0.55; letter-spacing: 0.06em; }

    .cauce {
      display: block; width: 100%; height: 150px;
      border-bottom: 1px solid var(--tinta);
    }
    main { flex: 1; padding: 40px 24px 56px; max-width: 1120px; width: 100%; margin: 0 auto; }
    .intro { max-width: 620px; margin: 0 0 36px; font-size: 15px; line-height: 1.6; }
    .intro b { font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .tool {
      display: flex; flex-direction: column; gap: 14px;
      border: 1px solid var(--tinta); background: var(--papel);
      padding: 22px; color: inherit; text-decoration: none;
      transition: background 0.15s ease;
    }
    .tool:hover { background: var(--lima); }
    .tool:focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
    .tool-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .tool-idx { font-family: var(--mono); font-size: 11px; opacity: 0.55; }
    .tool-name { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; margin: 0; }
    .tool-desc { font-size: 13.5px; line-height: 1.55; margin: 0; flex: 1; }
    .tool-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em;
      border: 1px solid var(--tinta); padding: 3px 7px;
    }
    .tool-go {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
      border-top: 1px solid rgba(38,41,41,0.18); padding-top: 12px;
      display: flex; justify-content: space-between;
    }
    footer {
      border-top: 1px solid var(--tinta); padding: 14px 24px;
      font-size: 11px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    footer span { opacity: 0.55; }
    @media (max-width: 560px) {
      header { flex-direction: column; gap: 4px; padding: 16px; }
      main { padding: 28px 16px 40px; }
      .cauce { height: 100px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="marca">CAUCE<span> · HERRAMIENTAS</span></div>
    <div class="firma">FLOC* · uso interno</div>
  </header>

  <svg class="cauce" id="cauce" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true"></svg>

  <main>
    <p class="intro">
      Herramientas generativas del sistema visual <b>CAUCE</b>. Todo se procesa en tu
      navegador: las imágenes que cargas no salen de tu equipo. Misma semilla y misma
      receta dan siempre la misma pieza.
    </p>

    <div class="grid" id="tools"></div>
  </main>

  <footer>
    <div>CAUCE hace visible el cauce.</div>
    <span>Contacto: FLOC* · wearefloc.com</span>
  </footer>

  <script>
    // Añadir una herramienta = añadir una entrada aquí.
    const TOOLS = [
      {
        idx: '01',
        name: 'CAZ',
        url: './caz/',
        desc: 'Motor generativo de línea de canal. Patrones vectoriales, retratos grabados desde foto, formas contenedoras y símbolos (incluida la banda Möbius para el logo).',
        tags: ['PATRÓN', 'RETRATO', 'FORMA', 'SÍMBOLO', 'SVG · PNG · GIF · WEBM'],
      },
      {
        idx: '02',
        name: 'CAUCE SYSTEM',
        url: 'https://caucesuystem.netlify.app/',
        external: true,
        desc: 'Estudio de campos de flujo y Möbius Flow 3D con superficie iluminada, biblioteca de proyectos y exportación de vídeo.',
        tags: ['MÖBIUS FLOW 1.1', '3D', 'VÍDEO'],
      },
    ];

    const grid = document.getElementById('tools');
    for (const t of TOOLS) {
      const a = document.createElement('a');
      a.className = 'tool';
      a.href = t.url;
      if (t.external) { a.target = '_blank'; a.rel = 'noopener'; }
      a.innerHTML = `
        <div class="tool-head"><h2 class="tool-name"></h2><span class="tool-idx"></span></div>
        <p class="tool-desc"></p>
        <div class="tool-tags"></div>
        <div class="tool-go"><span>ABRIR</span><span>${t.external ? '↗' : '→'}</span></div>`;
      a.querySelector('.tool-name').textContent = t.name;
      a.querySelector('.tool-idx').textContent = t.idx;
      a.querySelector('.tool-desc').textContent = t.desc;
      const tags = a.querySelector('.tool-tags');
      for (const tag of t.tags) {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = tag;
        tags.appendChild(s);
      }
      grid.appendChild(a);
    }

    // Cabecera: familia de líneas de canal — compresión al centro, apertura fuera.
    const svg = document.getElementById('cauce');
    const N = 26, W = 1200, H = 150;
    let d = '';
    for (let i = 0; i < N; i++) {
      const u = (i / (N - 1)) * 2 - 1;
      const y0 = H / 2 + Math.sign(u) * Math.pow(Math.abs(u), 1.7) * (H / 2 - 6);
      const amp = 16 * (1 - Math.abs(u) * 0.7);
      d += `M0 ${y0.toFixed(1)}`;
      for (let x = 20; x <= W; x += 20) {
        const y = y0 + amp * Math.sin((x / W) * Math.PI * 2.2 + 0.6) * Math.cos((x / W) * Math.PI * 0.8);
        d += `L${x} ${y.toFixed(1)}`;
      }
    }
    svg.innerHTML = `<path d="${d}" fill="none" stroke="#262929" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  </script>
</body>
</html>
